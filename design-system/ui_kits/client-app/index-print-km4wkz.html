<script type="text/babel">
const DS_APP = window.NoraSuleimanHomeBeautyDesignSystem_5b646a;

function App() {
  const data = window.NSData;
  const [stack, setStack] = React.useState([{ name: 'home', params: {} }]);
  const [tab, setTab] = React.useState('discover');
  const [fav, setFav] = React.useState({ p1: true, p3: true });

  const top = stack[stack.length - 1];

  // Reset scroll on screen change
  React.useEffect(() => {
    const el = document.getElementById('screen');
    if (el) el.scrollTo({ top: 0, behavior: 'auto' });
  }, [top.name, top.params]);

  function nav(name, params) {
    if (name === 'back') return setStack((s) => s.length > 1 ? s.slice(0, -1) : s);
    if (name === 'home') return setStack([{ name: 'home', params: {} }]);
    setStack((s) => [...s, { name, params: params || {} }]);
  }

  function toggleFav(id) { setFav((f) => ({ ...f, [id]: !f[id] })); }

  function switchTab(t) {
    setTab(t);
    if (t === 'discover') setStack([{ name: 'home', params: {} }]);
    if (t === 'bookings') setStack([{ name: 'bookings', params: {} }]);
    if (t === 'profile')  setStack([{ name: 'profile', params: {} }]);
    if (t === 'chat')     setStack([{ name: 'home', params: {} }]); // placeholder
  }

  const providerById = (id) => data.providers.find((p) => p.id === id);
  const serviceById = (provider, sid) => provider.services.find((s) => s.id === sid);
  const addrTextById = (id) => (data.addresses.find((a) => a.id === id) || {}).text;

  let screen = null;
  if (top.name === 'home') screen = <HomeScreen nav={nav} data={data} fav={fav} toggleFav={toggleFav} />;
  else if (top.name === 'provider') {
    const p = providerById(top.params.id);
    screen = <ProviderScreen nav={nav} provider={p} fav={fav} toggleFav={toggleFav} />;
  }
  else if (top.name === 'service') {
    const p = providerById(top.params.id);
    const s = serviceById(p, top.params.serviceId);
    screen = <ServiceScreen nav={nav} provider={p} service={s} />;
  }
  else if (top.name === 'booking') {
    const p = providerById(top.params.id);
    const s = serviceById(p, top.params.serviceId);
    screen = <BookingCreateScreen nav={nav} provider={p} service={s} addresses={data.addresses} slotsData={data.slots} days={data.days} total={top.params.total} />;
  }
  else if (top.name === 'review') {
    const p = providerById(top.params.id);
    const s = serviceById(p, top.params.serviceId);
    screen = <ReviewPayScreen nav={nav} provider={p} service={s} total={top.params.total} day={top.params.day} slot={top.params.slot} addrText={addrTextById(top.params.addr)} />;
  }
  else if (top.name === 'confirmed') {
    const p = providerById(top.params.id);
    const s = serviceById(p, top.params.serviceId);
    screen = <ConfirmationScreen nav={nav} provider={p} service={s} total={top.params.total} day={top.params.day} slot={top.params.slot} addrText={top.params.addrText} />;
  }
  else if (top.name === 'bookings') screen = <BookingsScreen nav={nav} bookings={data.bookings} />;
  else if (top.name === 'profile') screen = <ProfileScreen nav={nav} />;

  return screen;
}

function TabBar() {
  const [tab, setTab] = React.useState('discover');
  const { BottomNavBar } = DS_APP;
  const tabs = [
    { key: 'discover', icon: 'search', label: 'استكشفي' },
    { key: 'bookings', icon: 'event', label: 'حجوزاتي' },
    { key: 'chat', icon: 'chat_bubble', label: 'المحادثات', badge: 2 },
    { key: 'profile', icon: 'person', label: 'حسابي' },
  ];
  return <BottomNavBar tabs={tabs} active={tab} onChange={(k) => { setTab(k); window.__navTab && window.__navTab(k); }} />;
}

// Mount: shared tab state by lifting App + Tab into one root
function Shell() {
  const data = window.NSData;
  const [stack, setStack] = React.useState([{ name: 'home', params: {} }]);
  const [tab, setTab] = React.useState('discover');
  const [fav, setFav] = React.useState({ p1: true, p3: true });
  const top = stack[stack.length - 1];

  React.useEffect(() => {
    const el = document.getElementById('screen');
    if (el) el.scrollTo({ top: 0, behavior: 'auto' });
  }, [top.name, JSON.stringify(top.params)]);

  function nav(name, params) {
    if (name === 'back') return setStack((s) => s.length > 1 ? s.slice(0, -1) : s);
    if (name === 'home') { setTab('discover'); return setStack([{ name: 'home', params: {} }]); }
    if (name === 'bookings') { setTab('bookings'); return setStack([{ name: 'bookings', params: {} }]); }
    if (name === 'notifications') return; // hook-up point
    setStack((s) => [...s, { name, params: params || {} }]);
  }
  function toggleFav(id) { setFav((f) => ({ ...f, [id]: !f[id] })); }

    setTab(t);
    if (t === 'discover') setStack([{ name: 'home', params: {} }]);
    else if (t === 'bookings') setStack([{ name: 'bookings', params: {} }]);
    else if (t === 'profile') setStack([{ name: 'profile', params: {} }]);
    else setStack([{ name: 'home', params: {} }]);
  }

  const providerById = (id) => data.providers.find((p) => p.id === id);
  const serviceById = (p, sid) => p && p.services.find((s) => s.id === sid);
  const addrTextById = (id) => (data.addresses.find((a) => a.id === id) || {}).text;

  let screen = null;
  if (top.name === 'home') screen = <HomeScreen nav={nav} data={data} fav={fav} toggleFav={toggleFav} />;
  else if (top.name === 'provider') screen = <ProviderScreen nav={nav} provider={providerById(top.params.id)} fav={fav} toggleFav={toggleFav} />;
  else if (top.name === 'service') {
    const p = providerById(top.params.id); screen = <ServiceScreen nav={nav} provider={p} service={serviceById(p, top.params.serviceId)} />;
  } else if (top.name === 'booking') {
    const p = providerById(top.params.id); screen = <BookingCreateScreen nav={nav} provider={p} service={serviceById(p, top.params.serviceId)} addresses={data.addresses} slotsData={data.slots} days={data.days} total={top.params.total} />;
  } else if (top.name === 'review') {
    const p = providerById(top.params.id); screen = <ReviewPayScreen nav={nav} provider={p} service={serviceById(p, top.params.serviceId)} total={top.params.total} day={top.params.day} slot={top.params.slot} addrText={addrTextById(top.params.addr)} />;
  } else if (top.name === 'confirmed') {
    const p = providerById(top.params.id); screen = <ConfirmationScreen nav={nav} provider={p} service={serviceById(p, top.params.serviceId)} total={top.params.total} day={top.params.day} slot={top.params.slot} addrText={top.params.addrText} />;
  } else if (top.name === 'bookings') screen = <BookingsScreen nav={nav} bookings={data.bookings} />;
  else if (top.name === 'profile') screen = <ProfileScreen nav={nav} />;

  const { BottomNavBar } = DS_APP;
  const tabs = [
    { key: 'discover', icon: 'search', label: 'استكشفي' },
    { key: 'bookings', icon: 'event', label: 'حجوزاتي' },
    { key: 'chat', icon: 'chat_bubble', label: 'المحادثات', badge: 2 },
    { key: 'profile', icon: 'person', label: 'حسابي' },
  ];

  return (
    <>
      {ReactDOM.createPortal(screen, document.getElementById('screen'))}
      {ReactDOM.createPortal(<BottomNavBar tabs={tabs} active={tab} onChange={switchTab} />, document.getElementById('tabs'))}
    </>
  );
}

const wait = () => {
  if (window.HomeScreen && window.BookingCreateScreen && window.BookingsScreen && DS_APP) {
    const host = document.createElement('div');
    document.body.appendChild(host);
    ReactDOM.createRoot(host).render(<Shell />);
  } else { setTimeout(wait, 40); }
};
wait();
