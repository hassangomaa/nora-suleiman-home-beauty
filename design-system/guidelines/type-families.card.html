<!-- @dsCard group="Type" viewport="700x180" name="Font Families" subtitle="Tajawal (Arabic, primary) + Inter (Latin/numerals)" -->
<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--bg-canvas)}
  .wrap{padding:var(--space-5);display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6)}
  .tag{font:600 11px/1 var(--font-latin);letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:8px}
  .ar{font-family:var(--font-arabic);color:var(--text-primary)}
  .la{font-family:var(--font-latin);color:var(--text-primary)}
  .big{font-size:34px;line-height:1.3}
  .w{display:flex;gap:14px;align-items:baseline;color:var(--text-secondary);font-size:13px;margin-top:6px}
  .w b{color:var(--text-primary)}
</style></head>
<body><div class="wrap">
  <div>
    <div class="tag">Tajawal · Arabic UI</div>
    <div class="ar big">نورة سليمان للتجميل المنزلي</div>
    <div class="w ar"><span style="font-weight:400">Regular ٤٠٠</span><span style="font-weight:500">Medium ٥٠٠</span><span style="font-weight:700">Bold ٧٠٠</span></div>
  </div>
  <div dir="ltr" style="text-align:left">
    <div class="tag">Inter · Latin & numerals</div>
    <div class="la big">Nora Home Beauty</div>
    <div class="w la"><span style="font-weight:400">Regular 400</span><span style="font-weight:500">Medium 500</span><span style="font-weight:600">Semi 600</span><span style="font-weight:700">Bold 700</span></div>
  </div>
</div></body></html>
