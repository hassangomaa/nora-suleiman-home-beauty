<!-- @dsCard group="Colors" viewport="700x200" name="Theme — Light & Dark" subtitle="Semantic surface/text roles mapped across both modes" -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;font-family:var(--font-base);background:#efeaec;display:flex;gap:0}
  .pane{flex:1;padding:var(--space-5);background:var(--bg-canvas);color:var(--text-primary)}
  .tag{font:600 11px/1 var(--font-latin);letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:var(--space-3)}
  .card{background:var(--bg-surface-raised);border:1px solid var(--border-default);border-radius:var(--radius-lg);box-shadow:var(--elevation-2);padding:var(--space-4);display:flex;flex-direction:column;gap:8px}
  .h{font:700 16px/1.4 var(--font-base)}
  .s{font:400 13px/1.4 var(--font-base);color:var(--text-secondary)}
  .btn{align-self:flex-start;background:var(--action-primary);color:var(--text-on-primary);border-radius:var(--radius-md);padding:8px 16px;font:500 13px/1 var(--font-base)}
  .tint{background:var(--bg-tint);color:var(--primary-700);border-radius:var(--radius-sm);padding:4px 10px;font:500 12px/1 var(--font-base);align-self:flex-start}
</style></head>
<body>
<div class="pane" data-theme="light">
  <div class="tag">Light</div>
  <div class="card"><div class="h">لطيفة العتيبي</div><div class="s">ميك أب · عناية بالبشرة</div><span class="tint">مميّزة</span><span class="btn">احجزي الآن</span></div>
</div>
<div class="pane" data-theme="dark">
  <div class="tag">Dark</div>
  <div class="card"><div class="h">لطيفة العتيبي</div><div class="s">ميك أب · عناية بالبشرة</div><span class="tint">مميّزة</span><span class="btn">احجزي الآن</span></div>
</div>
</body></html>
