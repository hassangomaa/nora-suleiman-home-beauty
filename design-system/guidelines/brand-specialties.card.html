<!-- @dsCard group="Brand" viewport="700x150" name="Specialty Tiles" subtitle="Category chips that open the booking funnel" -->
<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--bg-canvas);font-family:var(--font-base)}
  .wrap{padding:var(--space-5);display:flex;gap:var(--space-4);flex-wrap:wrap}
  .tile{display:flex;flex-direction:column;align-items:center;gap:8px;width:84px}
  .ic{width:64px;height:64px;border-radius:var(--radius-lg);background:var(--bg-tint);display:flex;align-items:center;justify-content:center;color:var(--primary-500)}
  .l{font:500 13px/1 var(--font-base);color:var(--text-primary)}
</style></head>
<body><div class="wrap" id="w"></div>
<script>
const t=[['palette','ميك أب'],['content_cut','شعر'],['back_hand','أظافر'],['spa','عناية بالبشرة'],['format_paint','حنّاء'],['face_retouching_natural','عرايس']];
document.getElementById('w').innerHTML=t.map(([ic,l])=>`<div class="tile"><div class="ic"><span class="ms-icon ms-icon--lg">${ic}</span></div><span class="l">${l}</span></div>`).join('');
</script></body></html>
