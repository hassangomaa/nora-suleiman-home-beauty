<!-- @dsCard group="Colors" viewport="700x150" name="Secondary — Gold" subtitle="Muted gold luxury accent: premium, ratings, highlights" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--bg-canvas);font-family:var(--font-latin)}
  .wrap{padding:var(--space-5);display:flex;gap:var(--space-3)}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px}
  .chip{height:72px;border-radius:var(--radius-md);border:1px solid rgba(0,0,0,.05)}
  .k{font-size:12px;color:var(--text-secondary)}
  .v{font-size:12px;color:var(--text-primary);font-weight:600}
  .star{outline:2px solid var(--secondary-500);outline-offset:2px}
</style></head>
<body><div class="wrap" id="w"></div>
<script>
const scale=[['100','#F6EEDD'],['300','#E2C893'],['500','#C9A36A'],['700','#9A7A45']];
document.getElementById('w').innerHTML=scale.map(([k,v])=>`<div class="sw"><div class="chip ${k==='500'?'star':''}" style="background:${v}"></div><div class="k">secondary/${k}</div><div class="v">${v}</div></div>`).join('');
</script></body></html>
